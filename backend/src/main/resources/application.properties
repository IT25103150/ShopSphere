# ---------------------------------------------------------------
# ShopSphere backend configuration.
# Every value can be overridden by an environment variable, which is
# how START.bat passes the SQL Server details (see config.bat).
# ---------------------------------------------------------------
spring.application.name=shopsphere
server.port=8080
server.servlet.context-path=/

# SQL Server (ShopSphereDB is created by database/01_schema.sql)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ShopSphereDB};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourPassword}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000

# Schema is owned by database/01_schema.sql - Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.shopsphere.config.TableNameKeepingNamingStrategy
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false

# JSON / dates
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# File uploads (product images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Folder that holds product images (served at /images/products/**).
# Relative to the backend folder when run from an IDE; START.bat passes the absolute path.
shopsphere.images.dir=${IMAGES_DIR:../images/products}

# JWT (change the secret for anything other than a university demo)
shopsphere.jwt.secret=${JWT_SECRET:ShopSphereUniversityProjectSecretKey-ChangeMe-0123456789abcdef}
shopsphere.jwt.access-minutes=120
shopsphere.jwt.refresh-days=7

# CORS: allowed browser origins
shopsphere.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.level.org.hibernate.SQL=warn
